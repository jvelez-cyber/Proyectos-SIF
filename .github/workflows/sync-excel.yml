name: Sync Excel desde OneDrive

on:
  schedule:
    - cron: '0 6 */2 * *'   # Cada 48 horas a las 6am
  workflow_dispatch:          # También se puede lanzar manualmente desde GitHub

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Descargar Excel desde OneDrive
        run: |
          mkdir -p data
          curl -L --max-time 60 \
            "https://gobantioquia-my.sharepoint.com/:x:/r/personal/vtobonl_antioquia_gov_co/Documents/Base%20de%20datos%20-Proyectos%20Secretar%C3%ADa%20de%20Infraestructura%20F%C3%ADsica%20V3.xlsx?d=wb50ef87163ff4395aba6eb392e68c713&csf=1&web=1&e=yH4FxE&download=1" \
            -o data/proyectos.xlsx
          echo "Tamaño del archivo: $(wc -c < data/proyectos.xlsx) bytes"

      - name: Confirmar y subir si hay cambios
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add data/proyectos.xlsx
          git diff --staged --quiet && echo "Sin cambios" || (git commit -m "Auto-sync Excel desde OneDrive $(date +'%Y-%m-%d')" && git push)
